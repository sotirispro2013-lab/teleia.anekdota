<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Τελεια Ανεκδοτα</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Mono:wght@400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #07080a;
  --bg1:      #0d0f12;
  --bg2:      #12141a;
  --gold:     #e8c96d;
  --gold2:    #f5dfa0;
  --gold-dim: rgba(232,201,109,.08);
  --gold-glow:rgba(232,201,109,.18);
  --red:      #e85d5d;
  --teal:     #5dcfcf;
  --t1:       #f0ece4;
  --t2:       #8a8070;
  --t3:       #3a3630;
  --line:     rgba(232,201,109,.1);
  --line2:    rgba(232,201,109,.2);
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}

body {
  background:var(--bg);
  color:var(--t1);
  font-family:'Syne',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  cursor:default;
}

/* ── GRAIN OVERLAY ── */
body::before {
  content:'';
  position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
  opacity:.028;
  pointer-events:none;
  z-index:9999;
}

/* ── SPOTLIGHT BG ── */
.spotlight {
  position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
}
.spotlight::before {
  content:'';
  position:absolute;
  top:-30%;left:50%;transform:translateX(-50%);
  width:700px;height:700px;
  background:radial-gradient(ellipse at center, rgba(232,201,109,.07) 0%, transparent 70%);
  animation:breathe 8s ease-in-out infinite;
}
@keyframes breathe {
  0%,100%{transform:translateX(-50%) scale(1);opacity:.7}
  50%{transform:translateX(-50%) scale(1.15);opacity:1}
}

/* ── FLOATING PARTICLES ── */
#particles{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.p{
  position:absolute;
  font-size:1.1rem;
  opacity:0;
  animation:rise linear infinite;
  user-select:none;
  filter:blur(.5px);
}
@keyframes rise {
  0%  {transform:translateY(105vh) rotate(-10deg);opacity:0}
  8%  {opacity:.12}
  92% {opacity:.12}
  100%{transform:translateY(-8vh) rotate(12deg);opacity:0}
}

/* ── HEADER ── */
header {
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 36px;
  background:linear-gradient(to bottom,rgba(7,8,10,.98) 0%,rgba(7,8,10,.92) 100%);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
}
.logo {
  display:flex;flex-direction:column;gap:1px;
}
.logo-title {
  font-family:'Playfair Display',serif;
  font-size:1.35rem;
  font-weight:900;
  color:var(--gold);
  letter-spacing:.5px;
  line-height:1;
}
.logo-sub {
  font-family:'DM Mono',monospace;
  font-size:.6rem;
  color:var(--t3);
  letter-spacing:.18em;
  text-transform:uppercase;
}
.header-actions{display:flex;align-items:center;gap:10px}

.pill-btn {
  background:transparent;
  border:1px solid var(--t3);
  color:var(--t2);
  padding:7px 16px;
  border-radius:100px;
  cursor:pointer;
  font-family:'Syne',sans-serif;
  font-size:.7rem;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  transition:all .2s;
}
.pill-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-dim)}
.pill-btn.active{border-color:var(--gold);color:#000;background:var(--gold)}

.shuffle-btn {
  background:transparent;
  border:1px solid var(--t3);
  color:var(--t2);
  width:36px;height:36px;
  border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;transition:all .22s;
}
.shuffle-btn:hover{border-color:var(--teal);color:var(--teal);background:rgba(93,207,207,.08);transform:rotate(30deg)}

/* ── HERO ── */
.hero {
  position:relative;z-index:2;
  text-align:center;
  padding:64px 20px 48px;
  overflow:hidden;
}
.hero-eyebrow {
  font-family:'DM Mono',monospace;
  font-size:.65rem;
  letter-spacing:.25em;
  text-transform:uppercase;
  color:var(--gold);
  opacity:.7;
  margin-bottom:16px;
}
.hero-title {
  font-family:'Playfair Display',serif;
  font-size:clamp(2.8rem,8vw,6rem);
  font-weight:900;
  line-height:1;
  color:var(--t1);
  margin-bottom:8px;
  position:relative;
}
.hero-title em {
  font-style:italic;
  color:var(--gold);
  position:relative;
}
.hero-title em::after {
  content:'';
  position:absolute;left:0;bottom:-4px;width:100%;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.hero-count {
  font-family:'DM Mono',monospace;
  font-size:.75rem;
  color:var(--t3);
  letter-spacing:.1em;
  margin-top:20px;
}
.hero-count span {
  color:var(--gold);
  font-weight:500;
}

/* ── SEARCH ── */
.search-section{
  position:relative;z-index:2;
  max-width:600px;margin:0 auto;
  padding:0 24px 40px;
}
.search-outer {
  position:relative;
}
.search-icon {
  position:absolute;left:18px;top:50%;transform:translateY(-50%);
  color:var(--t3);font-size:.9rem;pointer-events:none;
}
#search {
  width:100%;
  background:var(--bg1);
  border:1px solid var(--line2);
  border-radius:100px;
  color:var(--t1);
  font-family:'Syne',sans-serif;
  font-size:.9rem;
  padding:14px 20px 14px 48px;
  outline:none;
  transition:border-color .25s, box-shadow .25s;
  letter-spacing:.02em;
}
#search::placeholder{color:var(--t3)}
#search:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px var(--gold-dim), 0 0 24px var(--gold-glow);
}

/* ── FILTER CHIPS ── */
.chips {
  display:flex;flex-wrap:wrap;gap:8px;
  max-width:680px;margin:0 auto 32px;
  padding:0 24px;
  position:relative;z-index:2;
  justify-content:center;
}
.chip {
  background:transparent;
  border:1px solid var(--t3);
  color:var(--t2);
  padding:5px 14px;
  border-radius:100px;
  cursor:pointer;
  font-family:'DM Mono',monospace;
  font-size:.62rem;
  letter-spacing:.1em;
  text-transform:uppercase;
  transition:all .18s;
  white-space:nowrap;
}
.chip:hover{border-color:var(--gold);color:var(--gold)}
.chip.on{border-color:var(--gold);color:#000;background:var(--gold)}

/* ── DIVIDER ── */
.divider {
  display:flex;align-items:center;gap:16px;
  max-width:680px;margin:0 auto 8px;
  padding:0 24px;
  position:relative;z-index:2;
}
.div-line{flex:1;height:1px;background:var(--line)}
.div-label {
  font-family:'DM Mono',monospace;
  font-size:.6rem;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--t3);
  white-space:nowrap;
}

/* ── FEED ── */
#feed {
  max-width:680px;margin:0 auto;
  padding:8px 24px 80px;
  position:relative;z-index:2;
}

.joke-card {
  position:relative;
  display:flex;align-items:flex-start;gap:20px;
  padding:20px 0;
  border-bottom:1px solid var(--line);
  animation:slideIn .3s ease both;
  transition:background .2s;
  border-radius:2px;
}
.joke-card:first-child{border-top:1px solid var(--line)}
@keyframes slideIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

.joke-num {
  font-family:'DM Mono',monospace;
  font-size:.65rem;
  color:var(--t3);
  letter-spacing:.05em;
  min-width:28px;
  padding-top:3px;
  flex-shrink:0;
  transition:color .2s;
}
.joke-card:hover .joke-num{color:var(--gold);opacity:.6}

.joke-body{flex:1;min-width:0}

.joke-cat-tag {
  display:inline-block;
  font-family:'DM Mono',monospace;
  font-size:.55rem;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--t3);
  margin-bottom:7px;
}

.joke-text {
  font-family:'Playfair Display',serif;
  font-size:1.05rem;
  font-style:italic;
  line-height:1.7;
  color:var(--t1);
  transition:color .2s;
}
.joke-card:hover .joke-text{color:var(--gold2)}

.joke-actions {
  display:flex;align-items:center;gap:6px;
  margin-top:10px;
}
.react-btn {
  background:transparent;border:none;
  font-size:.85rem;cursor:pointer;
  padding:3px 8px;border-radius:100px;
  transition:all .15s;
  display:flex;align-items:center;gap:4px;
  font-family:'DM Mono',monospace;font-size:.6rem;
  color:var(--t3);
  border:1px solid transparent;
}
.react-btn:hover{background:var(--gold-dim);border-color:var(--line2)}

/* ── SPOTLIGHT JOKE ── */
.spotlight-card {
  position:relative;z-index:2;
  max-width:680px;margin:0 auto 32px;
  padding:0 24px;
}
.spotlight-inner {
  background:var(--bg1);
  border:1px solid var(--line2);
  border-radius:12px;
  padding:28px 32px;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  transition:border-color .25s, box-shadow .25s;
}
.spotlight-inner:hover {
  border-color:var(--gold);
  box-shadow:0 0 40px var(--gold-glow);
}
.spotlight-inner::before {
  content:'"';
  position:absolute;top:-20px;left:16px;
  font-family:'Playfair Display',serif;
  font-size:9rem;
  color:var(--gold);
  opacity:.06;
  line-height:1;
  pointer-events:none;
}
.spotlight-label {
  font-family:'DM Mono',monospace;
  font-size:.58rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--gold);
  opacity:.6;
  margin-bottom:10px;
}
.spotlight-text {
  font-family:'Playfair Display',serif;
  font-size:1.3rem;
  font-style:italic;
  line-height:1.65;
  color:var(--t1);
}
.spotlight-hint {
  font-family:'DM Mono',monospace;
  font-size:.58rem;
  color:var(--t3);
  margin-top:14px;
  letter-spacing:.1em;
}

/* ── EMPTY ── */
.empty-state{
  text-align:center;padding:80px 20px;
  font-family:'DM Mono',monospace;
  font-size:.7rem;letter-spacing:.15em;
  text-transform:uppercase;color:var(--t3);
}

/* ── MEMBERS PANEL ── */
.panel-backdrop {
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.7);
  z-index:500;
  backdrop-filter:blur(4px);
  animation:fadeB .2s ease;
}
.panel-backdrop.open{display:flex;align-items:flex-end;justify-content:center}
@keyframes fadeB{from{opacity:0}to{opacity:1}}
.panel {
  background:var(--bg1);
  border:1px solid var(--line2);
  border-radius:16px 16px 0 0;
  width:100%;max-width:680px;
  max-height:70vh;
  overflow-y:auto;
  padding:32px 28px 40px;
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.panel-handle {
  width:36px;height:3px;
  background:var(--t3);border-radius:2px;
  margin:0 auto 24px;
}
.panel-title {
  font-family:'Playfair Display',serif;
  font-size:1.4rem;font-style:italic;
  color:var(--gold);margin-bottom:20px;
}
.panel-empty {
  font-family:'DM Mono',monospace;
  font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;
  color:var(--t3);padding:40px 0;text-align:center;line-height:2.2;
}

/* ── TOAST ── */
.toast {
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--bg2);border:1px solid var(--gold);
  color:var(--gold);
  font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.1em;
  padding:10px 22px;border-radius:100px;
  opacity:0;pointer-events:none;transition:all .3s;
  z-index:9000;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── FOOTER ── */
footer {
  border-top:1px solid var(--line);
  padding:20px 28px;
  display:flex;justify-content:space-between;align-items:center;
  position:relative;z-index:2;
}
.footer-left {
  font-family:'DM Mono',monospace;
  font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);
}
.footer-right {
  font-family:'DM Mono',monospace;
  font-size:.58rem;color:var(--t3);letter-spacing:.08em;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--t3);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--gold)}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  header{padding:14px 20px}
  .logo-title{font-size:1.1rem}
  .hero{padding:40px 16px 32px}
  #feed,.search-section,.chips,.spotlight-card,.divider{padding-left:16px;padding-right:16px}
  .spotlight-inner{padding:20px}
}
</style>
</head>
<body>

<div class="spotlight"></div>
<div id="particles"></div>

<header>
  <div class="logo">
    <div class="logo-title">Τελεια Ανεκδοτα</div>
    <div class="logo-sub">Curated · <span id="totalCount">—</span> jokes</div>
  </div>
  <div class="header-actions">
    <button class="shuffle-btn" onclick="shuffleJokes()" title="Shuffle">⇄</button>

    <button class="pill-btn" onclick="openPanel()">Members</button>
  </div>
</header>

<section class="hero">
  <div class="hero-eyebrow">The Definitive Greek Joke Collection</div>
  <h1 class="hero-title">Γέλιο<br><em>on demand</em></h1>

</section>

<!-- Spotlight random joke -->
<div class="spotlight-card">
  <div class="spotlight-inner" onclick="newSpotlight()" title="Click for a new one">

    <div class="spotlight-hint">click for a new one</div>

</div>

<section class="search-section">

  </div>
</section>

<div class="chips" id="chips"></div>

<div class="divider">
  <div class="div-line"></div>
  <div class="div-label" id="countLabel">— entries</div>
  <div class="div-line"></div>
</div>

<div id="feed"></div>

<footer>
  <div class="footer-left">Τελεια Ανεκδοτα &mdash; All rights reserved</div>
  <div class="footer-right" id="footerLang">GR mode</div>
</footer>

<!-- Members panel -->
<div class="panel-backdrop" id="panelBackdrop" onclick="closePanel()">
  <div class="panel" onclick="event.stopPropagation()">
    <div class="panel-handle"></div>
    <div class="panel-title">Members</div>
    <div id="membersList"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

{en:"I read messages and panic later.",gr:"Διαβάζω μηνύματα και πανικοβάλλομαι μετά.",c:"social"},

// ── INIT ORDER ──
function resetOrder(){jokeOrder=jokes.map((_,i)=>i)}
resetOrder();
document.getElementById('totalCount').textContent=jokes.length;

// ── PARTICLES ──
const emojis=['😂','🤣','😆','😄','💀','🥲','😅','😁','🤭','😜','🤪','😹'];
const pc=document.getElementById('particles');
function spawnParticle(){
  const el=document.createElement('span');
  el.className='p';
  el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
  const sz=0.8+Math.random()*1.6;
  el.style.cssText=`font-size:${sz}rem;left:${Math.random()*100}%;animation-duration:${10+Math.random()*16}s;animation-delay:${Math.random()*4}s`;
  pc.appendChild(el);
  setTimeout(()=>el.remove(),(26+Math.random()*4)*1000);
}
for(let i=0;i<18;i++)spawnParticle();
setInterval(spawnParticle,900);

// ── BUILD CHIPS ──
function buildChips(){
  const el=document.getElementById('chips');
  el.innerHTML=Object.entries(cats).map(([k,v])=>
    `<button class="chip${activeCategory===k?' on':''}" onclick="setCategory('${k}')">${v}</button>`
  ).join('');
}
buildChips();

function setCategory(c){
  activeCategory=c;
  buildChips();
  renderFeed();
}

// ── SPOTLIGHT ──
function newSpotlight(){
  const pool=jokes.filter(j=>activeCategory==='all'||j.c===activeCategory);
  const j=pool[Math.floor(Math.random()*pool.length)];
  const el=document.getElementById('spotlightText');
  el.style.opacity='0';
  el.style.transform='translateY(6px)';
  setTimeout(()=>{
    el.textContent=lang==='gr'?j.gr:j.en;
    el.style.transition='all .35s ease';
    el.style.opacity='1';
    el.style.transform='translateY(0)';
  },180);
}
newSpotlight();

// ── SHUFFLE ──
function shuffleJokes(){
  jokeOrder=[...jokeOrder].sort(()=>Math.random()-.5);
  shuffled=true;
  renderFeed();
  showToast('Shuffled ✦');
}

// ── RENDER FEED ──
function renderFeed(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const feed=document.getElementById('feed');
  const countEl=document.getElementById('countLabel');
  const heroEl=document.getElementById('heroCount');

  const list=jokeOrder
    .map(i=>({joke:jokes[i],idx:i}))
    .filter(({joke:j})=>{
      const txt=(lang==='gr'?j.gr:j.en).toLowerCase();
      const catOk=activeCategory==='all'||j.c===activeCategory;
      return catOk&&txt.includes(q);
    });

  const n=list.length;
  countEl.textContent=`${n} ${n===1?'entry':'entries'}`;
  heroEl.innerHTML=`<span>${jokes.length}</span> jokes — <span>${n}</span> showing`;

  feed.innerHTML='';
  if(!n){
    feed.innerHTML='<div class="empty-state">No results — try a different search</div>';
    return;
  }

  const frag=document.createDocumentFragment();
  list.forEach(({joke:j,idx},i)=>{
    const div=document.createElement('div');
    div.className='joke-card';
    div.style.animationDelay=(i*14)+'ms';
    div.innerHTML=`
      <span class="joke-num">${String(i+1).padStart(2,'0')}</span>
      <div class="joke-body">
        <span class="joke-cat-tag">${cats[j.c]||''}</span>
        <div class="joke-text">${lang==='gr'?j.gr:j.en}</div>
        <div class="joke-actions">
          <button class="react-btn" onclick="copyJoke(${idx})" title="Copy">⎘</button>
        </div>
      </div>`;
    frag.appendChild(div);
  });
  feed.appendChild(frag);
}

// ── COPY ──
function copyJoke(idx){
  const j=jokes[idx];
  const txt=lang==='gr'?j.gr:j.en;
  navigator.clipboard.writeText(txt).then(()=>showToast('Copied ✦')).catch(()=>{});
}

// ── TOAST ──
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

// ── LANG ──
function toggleLang(){
  lang=lang==='gr'?'en':'gr';
  document.getElementById('langBtn').textContent=lang==='gr'?'EN / GR':'GR / EN';
  document.getElementById('footerLang').textContent=lang==='gr'?'GR mode':'EN mode';
  newSpotlight();
  renderFeed();
}

// ── MEMBERS ──
const members=[];
function openPanel(){
  const list=document.getElementById('membersList');
  list.innerHTML=members.length?members.map((m,i)=>`
    <div style="display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)">
      <span style="font-family:'DM Mono',monospace;font-size:.6rem;color:var(--t3);min-width:24px">${String(i+1).padStart(2,'0')}</span>
      <div style="width:34px;height:34px;border-radius:50%;background:var(--gold-dim);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:var(--gold);font-family:'DM Mono',monospace">${m.trim().split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()}</div>
      <span style="font-size:.95rem;color:var(--t1)">${m}</span>
    </div>`).join('')
    :`<div class="panel-empty">Coming Soon<br><span style="font-size:.55rem;opacity:.5">Member names will appear here</span></div>`;
  document.getElementById('panelBackdrop').classList.add('open');
}
function closePanel(){document.getElementById('panelBackdrop').classList.remove('open')}

// ── KEYBOARD ──
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==document.getElementById('search')){
    e.preventDefault();document.getElementById('search').focus();
  }
  if(e.key==='Escape'){
    closePanel();
    document.getElementById('search').blur();
  }
});

renderFeed();
</script>
