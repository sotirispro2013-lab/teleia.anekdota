<html lang="el">
<head>

  <style>

    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background:#fff7c7;
      transition:.3s;
      font-family:'Nunito',Arial,sans-serif;
      min-height:100vh;
      overflow-x:hidden;
    }
    body.dark{background:#0f0f0f;color:#fff}

    /* ─── FLOATING LAUGH BACKGROUND ─── */
    #bg-emojis {
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:0;
      overflow:hidden;
    }
    .laugh {
      position:absolute;
      font-size:2.2rem;
      opacity:0.13;
      animation: floatUp linear infinite;
      user-select:none;
    }
    body.dark .laugh { opacity:0.18; }
    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(-15deg) scale(.8); opacity:0; }
      10%  { opacity:0.13; }
      90%  { opacity:0.13; }
      100% { transform: translateY(-12vh) rotate(20deg) scale(1.1); opacity:0; }
    }

    /* ─── HEADER ─── */
    header{
      position:sticky;top:0;
      background:rgba(255,255,255,.82);
      backdrop-filter:blur(14px);
      display:flex;justify-content:space-between;align-items:center;
      padding:14px 20px;
      z-index:10;
      border-bottom:2px solid #ffe082;
      box-shadow:0 2px 18px rgba(244,180,0,.12);
    }
    body.dark header{background:rgba(15,15,15,.85);border-color:#333;}
    h1{
      color:#f4b400;
      font-family:'Fredoka One',cursive;
      font-size:1.7rem;
      letter-spacing:1px;
      text-shadow:2px 2px 0 #ffe08266;
    }
    body.dark h1{text-shadow:2px 2px 0 #f4b40044;}
    .controls button{
      margin-left:10px;padding:9px 16px;
      border:none;border-radius:20px;cursor:pointer;
      font-weight:900;font-family:'Nunito',Arial,sans-serif;
      font-size:.9rem;
      transition:.2s;
    }
    .controls button:hover{transform:scale(1.08);}
    .lang{background:#ffd54f;color:#333;}
    .darkbtn{background:#333;color:#fff;}
    body.dark .darkbtn{background:#ffd54f;color:#333;}

    /* ─── CONTAINER ─── */
    .container{
      max-width:900px;
      margin:auto;padding:24px 20px;
      position:relative;z-index:1;
    }
    .search-wrap {
      position:relative;margin-bottom:18px;
    }
    .search-wrap::before {
      content:"🔍";
      position:absolute;left:14px;top:50%;transform:translateY(-50%);
      font-size:1.1rem;
    }
    input{
      width:100%;padding:13px 13px 13px 44px;
      border-radius:30px;
      border:2.5px solid #f4b400;
      font-size:1rem;
      font-family:'Nunito',Arial,sans-serif;
      background:#fffde7;
      outline:none;
      transition:.2s;
      box-shadow:0 2px 10px rgba(244,180,0,.12);
    }
    input:focus{border-color:#ffca28;box-shadow:0 0 0 3px rgba(244,180,0,.18);}
    body.dark input{background:#1a1a1a;color:#fff;border-color:#444;}

    /* ─── JOKE COUNT ─── */
    .joke-count{
      text-align:center;
      font-size:.85rem;
      color:#999;
      margin-bottom:14px;
      font-weight:700;
    }

    /* ─── POSTS ─── */
    .post{
      background:rgba(255,255,255,.92);
      margin-bottom:12px;padding:16px 18px;
      border-radius:16px;
      border:2px solid #ffe082;
      transition:.22s;
      cursor:default;
      position:relative;
      overflow:hidden;
    }
    body.dark .post{background:#1e1e1e;border-color:#2e2e2e;}
    .post:hover{
      transform:scale(1.015) translateY(-2px);
      border-color:#f4b400;
      box-shadow:0 6px 24px rgba(244,180,0,.18);
    }
    .post::before{
      content:'';
      position:absolute;left:0;top:0;bottom:0;
      width:4px;
      background:linear-gradient(180deg,#f4b400,#ff7043);
      border-radius:4px 0 0 4px;
      opacity:0;
      transition:.2s;
    }
    .post:hover::before{opacity:1;}
    .text{font-size:1.05rem;line-height:1.55;font-weight:600;}

    /* ─── CATEGORY BADGE ─── */
    .cat{
      display:inline-block;
      font-size:.7rem;font-weight:900;
      padding:2px 10px;border-radius:20px;
      margin-bottom:6px;
      letter-spacing:.5px;
      text-transform:uppercase;
    }
    .cat-tech   {background:#e3f2fd;color:#1565c0;}
    .cat-life   {background:#f3e5f5;color:#7b1fa2;}
    .cat-moti   {background:#e8f5e9;color:#2e7d32;}
    .cat-food   {background:#fff8e1;color:#e65100;}
    .cat-social {background:#fce4ec;color:#c62828;}
    .cat-absurd {background:#e0f7fa;color:#006064;}
    .cat-gr     {background:#fff9c4;color:#827717;}
    body.dark .cat-tech   {background:#1a2a3a;color:#90caf9;}
    body.dark .cat-life   {background:#2a1a2e;color:#ce93d8;}
    body.dark .cat-moti   {background:#1a2e1a;color:#a5d6a7;}
    body.dark .cat-food   {background:#2e2010;color:#ffcc80;}
    body.dark .cat-social {background:#2e1018;color:#f48fb1;}
    body.dark .cat-absurd {background:#0a2022;color:#80deea;}
    body.dark .cat-gr     {background:#2a2800;color:#fff176;}

    /* no results */
    .empty{text-align:center;padding:60px 20px;opacity:.5;font-size:1.2rem;}
  </style>
</head>

const catLabels={
  tech:"💻 Tech",
  life:"🌀 Life",
  moti:"🚀 Motivation",
  food:"🍕 Food",
  social:"👥 Social",
  absurd:"🌀 Absurd",
  gr:"🇬🇷 Greek"
};
const catClass={
  tech:"cat-tech",life:"cat-life",moti:"cat-moti",food:"cat-food",social:"cat-social",absurd:"cat-absurd",gr:"cat-gr"
};

function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const feed=document.getElementById('feed');
  const countEl=document.getElementById('joke-count');
  feed.innerHTML='';

  const filtered=jokes.filter(j=>(lang==='gr'?j.gr:j.en).toLowerCase().includes(q));
  countEl.textContent=filtered.length+' jokes';

  if(filtered.length===0){
    feed.innerHTML='<div class="empty">😢 No jokes found...</div>';
    return;
  }

  filtered.forEach((j,i)=>{
    const div=document.createElement('div');
    div.className='post';
    div.style.animationDelay=(i*0.02)+'s';
    const catBadge=j.cat?`<span class="cat ${catClass[j.cat]||''}">${catLabels[j.cat]||j.cat}</span>`:'';
    div.innerHTML=`${catBadge}<div class="text">${lang==='gr'?j.gr:j.en}</div>`;
    feed.appendChild(div);
  });
}

function toggleLang(){lang=lang==='gr'?'en':'gr';render();}
function toggleDark(){document.body.classList.toggle('dark');}

// ─── FLOATING LAUGH BACKGROUND ───
const laughEmojis=['😂','🤣','😆','😄','🤭','😝','😜','🥲','💀','😹','🤪','😅','😁'];
const bg=document.getElementById('bg-emojis');

function spawnLaugh(){
  const el=document.createElement('span');
  el.className='laugh';
  el.textContent=laughEmojis[Math.floor(Math.random()*laughEmojis.length)];
  const size=1.2+Math.random()*2.2;
  el.style.fontSize=size+'rem';
  el.style.left=(Math.random()*100)+'%';
  const dur=8+Math.random()*14;
  el.style.animationDuration=dur+'s';
  el.style.animationDelay=(Math.random()*6)+'s';
  bg.appendChild(el);
  setTimeout(()=>el.remove(),(dur+6)*1000);
}

// Spawn initial batch
for(let i=0;i<30;i++) spawnLaugh();
// Keep spawning
setInterval(spawnLaugh,600);

render();
